name: Build and release SDM for Windows
on:
  push:
    branches: [main]
    paths-ignore: ['README*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sdm-windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements-lock.txt
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $sdmVersion = & .venv/Scripts/python.exe -c "from app_version import VERSION; print(VERSION)"
          "value=$sdmVersion" >> $env:GITHUB_OUTPUT
      - name: Download verified build tools
        shell: pwsh
        run: .venv/Scripts/python.exe prepare_ci_tools.py
      - name: Motor and security checks
        shell: pwsh
        env:
          SDM_DATA_DIR: '${{ github.workspace }}/build/unit-data'
        run: .venv/Scripts/python.exe -m unittest test_advanced_features test_responsiveness test_features test_download_safety test_progress_meter test_browser_files test_browser_bridge test_transfer_details test_video_access test_theme_section
      - name: UI and real transfer checks
        shell: pwsh
        run: |
          $env:SDM_DATA_DIR = "$env:GITHUB_WORKSPACE/build/ui-data"
          .venv/Scripts/python.exe test_ui_031.py
          if ($LASTEXITCODE -ne 0) { throw 'UI checks failed' }
          $env:SDM_DATA_DIR = "$env:GITHUB_WORKSPACE/build/theme-ui-data"
          .venv/Scripts/python.exe test_ui_themes.py
          if ($LASTEXITCODE -ne 0) { throw 'Six theme checks failed' }
          $env:SDM_DATA_DIR = "$env:GITHUB_WORKSPACE/build/transfer-data"
          .venv/Scripts/python.exe test_gui_transfer.py
          if ($LASTEXITCODE -ne 0) { throw 'Transfer checks failed' }
          $env:SDM_DATA_DIR = "$env:GITHUB_WORKSPACE/build/remove-data"
          .venv/Scripts/python.exe test_cancel_remove_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Remove responsiveness checks failed' }
          .venv/Scripts/python.exe test_section_live.py
          if ($LASTEXITCODE -ne 0) { throw 'Section media checks failed' }
          .venv/Scripts/python.exe test_update_handoff_live.py
          if ($LASTEXITCODE -ne 0) { throw 'Update handoff checks failed' }
      - name: Build installer on GitHub runner
        shell: pwsh
        run: |
          $sdmCompiler = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $sdmCompiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          ./build.ps1 -InnoCompiler $sdmCompiler
      - name: Prepare release assets
        shell: pwsh
        env:
          SDM_VERSION: '${{ steps.version.outputs.value }}'
        run: |
          $sdmName = "SDM-Setup-$env:SDM_VERSION.exe"
          $sdmDigest = (Get-FileHash -LiteralPath "dist/$sdmName" -Algorithm SHA256).Hash.ToLower()
          "$sdmDigest  $sdmName" | Set-Content -LiteralPath "dist/SDM-Setup-$env:SDM_VERSION.sha256" -Encoding ascii
          Compress-Archive -Path extension/* -DestinationPath "dist/SDM-Extension-$env:SDM_VERSION.zip"
          .venv/Scripts/python.exe -c "import json,os; from pathlib import Path; v=os.environ['SDM_VERSION']; p=Path('dist/SDM-Setup-'+v+'.exe'); import hashlib; Path('dist/latest.json').write_text(json.dumps({'version':v,'url':'https://github.com/EmreGUNDOGAN/SDM-Updates/releases/download/v'+v+'/'+p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size':p.stat().st_size},indent=2),encoding='utf-8')"
      - uses: actions/upload-artifact@v4
        with:
          name: SDM-Windows-${{ steps.version.outputs.value }}
          path: |
            dist/SDM-Setup-*.exe
            dist/SDM-Setup-*.sha256
            dist/SDM-Extension-*.zip
            dist/latest.json
          retention-days: 14
      - name: Publish private source repository release
        shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
          SDM_VERSION: '${{ steps.version.outputs.value }}'
        run: |
          gh release view "v$env:SDM_VERSION" --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'This release version already exists. Increment VERSION before publishing.' }
          gh release create "v$env:SDM_VERSION" "dist/SDM-Setup-$env:SDM_VERSION.exe" "dist/SDM-Setup-$env:SDM_VERSION.sha256" "dist/SDM-Extension-$env:SDM_VERSION.zip" dist/latest.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "SDM $env:SDM_VERSION — Atlas, Orbit ve Nova" --notes-file "RELEASE-NOTES-$env:SDM_VERSION.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
