name: Build and release SDM for Windows
on:
  push:
    branches: [main]
    paths-ignore: ['README*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sdm-windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: [self-hosted, Windows, X64, sdm-ui]
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Create isolated Python environment on the SDM runner
        shell: pwsh
        run: |
          if (-not $env:SDM_RUNNER_PYTHON -or -not (Test-Path -LiteralPath $env:SDM_RUNNER_PYTHON)) {
            throw 'Configure SDM_RUNNER_PYTHON with an existing Python 3.12 executable on the runner.'
          }
          & $env:SDM_RUNNER_PYTHON -c "import sys; assert sys.version_info[:2] == (3, 12), 'Python 3.12 is required'"
          if ($LASTEXITCODE -ne 0) { throw 'Runner Python version check failed' }
          & $env:SDM_RUNNER_PYTHON -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Python environment creation failed' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m pip install -r requirements-lock.txt
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $sdmVersion = & .venv/Scripts/python.exe -c "from app_version import VERSION; print(VERSION)"
          "value=$sdmVersion" >> $env:GITHUB_OUTPUT
      - name: Verify exact source manifest
        shell: pwsh
        run: |
          .venv/Scripts/python.exe tools/check_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Source integrity check failed' }
      - name: Download verified build tools
        shell: pwsh
        run: .venv/Scripts/python.exe prepare_ci_tools.py
      - name: Motor and security checks
        shell: pwsh
        env:
          SDM_DATA_DIR: '${{ github.workspace }}/build/unit-data'
        run: .venv/Scripts/python.exe -m unittest test_advanced_features test_responsiveness test_features test_download_safety test_progress_meter test_browser_files test_browser_bridge test_transfer_details test_video_access test_theme_section test_ui_foundations test_source_manifest test_preview_report test_window_capture test_atlas_view test_atlas_preview_report test_dialog_inspection test_package_checks
      - name: Full native UI, real browser and media checks before packaging
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: '${{ github.workspace }}/build/pw-browsers'
          SDM_TEST_PYTHON: '${{ github.workspace }}/.venv/Scripts/python.exe'
          SDM_COMPONENT_VIEWPORT_HEIGHT: '640'
          PYTHONIOENCODING: utf-8
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependencies failed' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser preparation failed' }
          .venv/Scripts/python.exe tools/run_ui_checks.py
          if ($LASTEXITCODE -ne 0) { throw 'Native UI checks failed' }
          node test_extension.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Extension checks failed' }
          node test_capture.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Real HTTP checks failed' }
          node test_extension_refresh.cjs
          if ($LASTEXITCODE -ne 0) { throw 'SHA-256 checks failed' }
          foreach ($report in @('component','atlas','dialog','settings','odak')) {
            .venv/Scripts/python.exe "tools/report_${report}_previews.py"
            if ($LASTEXITCODE -ne 0) { throw "Preview report failed: $report" }
          }
          .venv/Scripts/python.exe tools/run_ui_checks.py test_section_live.py test_update_handoff_live.py
          if ($LASTEXITCODE -ne 0) { throw 'Media/handoff checks failed' }
      - name: Build and validate installer on the SDM runner
        shell: pwsh
        run: |
          ./build.ps1
      - name: Prepare release assets
        shell: pwsh
        env:
          SDM_VERSION: '${{ steps.version.outputs.value }}'
        run: |
          $sdmName = "SDM-Setup-$env:SDM_VERSION.exe"
          $sdmDigest = (Get-FileHash -LiteralPath "dist/$sdmName" -Algorithm SHA256).Hash.ToLower()
          "$sdmDigest  $sdmName" | Set-Content -LiteralPath "dist/SDM-Setup-$env:SDM_VERSION.sha256" -Encoding ascii
          Compress-Archive -Path extension/* -DestinationPath "dist/SDM-Extension-$env:SDM_VERSION.zip"
          .venv/Scripts/python.exe -c "import json,os; from pathlib import Path; v=os.environ['SDM_VERSION']; p=Path('dist/SDM-Setup-'+v+'.exe'); import hashlib; Path('dist/latest.json').write_text(json.dumps({'version':v,'url':'https://github.com/EmreGUNDOGAN/SDM-Updates/releases/download/v'+v+'/'+p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size':p.stat().st_size},indent=2),encoding='utf-8')"
      - name: Publish private source repository release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
          SDM_VERSION: '${{ steps.version.outputs.value }}'
        run: |
          gh release view "v$env:SDM_VERSION" --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'This release version already exists. Increment VERSION before publishing.' }
          $sdmNotesFile = "RELEASE-NOTES-$env:SDM_VERSION.md"
          $sdmReleaseTitle = (Get-Content -LiteralPath $sdmNotesFile -TotalCount 1) -replace '^#\s+', ''
          if (-not $sdmReleaseTitle.StartsWith("SDM $env:SDM_VERSION — ")) { throw 'Release notes title must match the build version.' }
          gh release create "v$env:SDM_VERSION" "dist/SDM-Setup-$env:SDM_VERSION.exe" "dist/SDM-Setup-$env:SDM_VERSION.sha256" "dist/SDM-Extension-$env:SDM_VERSION.zip" dist/latest.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $sdmReleaseTitle --notes-file $sdmNotesFile
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
