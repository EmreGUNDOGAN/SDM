name: Verify
on:
  pull_request:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-and-ui:
    runs-on: [self-hosted, Windows, X64, sdm-ui]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      SDM_DATA_DIR: '${{ github.workspace }}/build/verify-unit-data'
      PYTHONIOENCODING: utf-8
      NODE_USE_SYSTEM_CA: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          # The manifest describes the PR head, not GitHub's synthetic merge tree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Create isolated Python environment on the SDM runner
        run: |
          if (-not $env:SDM_RUNNER_PYTHON -or -not (Test-Path -LiteralPath $env:SDM_RUNNER_PYTHON)) {
            throw 'Configure SDM_RUNNER_PYTHON with an existing Python 3.12 executable on the runner.'
          }
          & $env:SDM_RUNNER_PYTHON -c "import sys; assert sys.version_info[:2] == (3, 12), 'Python 3.12 is required'"
          if ($LASTEXITCODE -ne 0) { throw 'Runner Python version check failed' }
          & $env:SDM_RUNNER_PYTHON -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Python environment creation failed' }
          (Join-Path $env:GITHUB_WORKSPACE '.venv/Scripts') >> $env:GITHUB_PATH
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source integrity, syntax and credential scan
        run: python tools/check_source.py
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Prepare SHA-pinned media tools for real tests
        run: python tools/prepare_test_media.py
      - name: Install locked browser test tools
        env:
          PLAYWRIGHT_BROWSERS_PATH: '${{ github.workspace }}/build/pw-browsers'
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependencies failed' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Isolated browser preparation failed' }
      - name: Engine, security, preferences and manifest regressions
        run: python -m unittest test_advanced_features test_responsiveness test_features test_download_safety test_progress_meter test_browser_files test_browser_bridge test_transfer_details test_video_access test_theme_section test_ui_foundations test_source_manifest test_preview_report test_window_capture test_atlas_view test_atlas_preview_report test_dialog_inspection test_package_checks test_music test_stats test_pano_view test_pano_preview_report test_yorunge_view
      - name: Four design-mode combinations and native UI in disposable profiles
        env:
          SDM_COMPONENT_VIEWPORT_HEIGHT: '640'
        run: python tools/run_ui_checks.py
      - name: Real media section and updater handoff checks in disposable profiles
        run: python tools/run_ui_checks.py test_section_live.py test_update_handoff_live.py
      - name: Validate all eight previews and write job summary
        run: python tools/report_component_previews.py
      - name: Validate Atlas workspace and menu previews
        run: python tools/report_atlas_previews.py
      - name: Validate Pano workspace, menu, toast and measured alignment
        run: python tools/report_pano_previews.py
      - name: Validate Yorunge workspace, instruments, menus and measured alignment
        run: python tools/report_yorunge_previews.py
      - name: Validate Pano link, capture and compact dialog previews
        run: python tools/report_pano_dialogs.py
      - name: Validate Pano transfer detail previews and measured geometry
        run: python tools/report_pano_details.py
      - name: Validate Pano tools, mode and conversion previews
        run: python tools/report_pano_tools.py
      - name: Real browser HTTP and SHA-256 checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: '${{ github.workspace }}/build/pw-browsers'
          SDM_TEST_PYTHON: python
        run: |
          node test_extension_scan.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Page scanner failed' }
          node test_extension.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Extension UI failed' }
          node test_capture.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Real browser HTTP failed' }
          node test_extension_refresh.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser SHA validation failed' }
      - name: Validate all download, tool, HUD and browser previews
        run: python tools/report_dialog_previews.py
      - name: Validate all six settings sections in four appearances
        run: python tools/report_settings_previews.py
      - name: Validate Odak cards, drawer, settings and adjacent queue menu
        run: python tools/report_odak_previews.py
