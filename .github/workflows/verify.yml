name: Verify
on:
  pull_request:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-and-ui:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SDM_DATA_DIR: '${{ github.workspace }}/build/verify-unit-data'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
        with:
          # The manifest describes the PR head, not GitHub's synthetic merge tree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source integrity, syntax and credential scan
        run: python tools/check_source.py
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Engine, security, preferences and manifest regressions
        run: python -m unittest test_advanced_features test_responsiveness test_features test_download_safety test_progress_meter test_browser_files test_browser_bridge test_transfer_details test_video_access test_theme_section test_ui_foundations test_source_manifest test_preview_report test_window_capture test_atlas_view test_atlas_preview_report
      - name: Four design-mode combinations and native UI in disposable profiles
        env:
          SDM_COMPONENT_VIEWPORT_HEIGHT: '640'
        run: python tools/run_ui_checks.py
      - name: Validate all eight previews and write job summary
        run: python tools/report_component_previews.py
      - name: Validate Atlas workspace and menu previews
        run: python tools/report_atlas_previews.py
